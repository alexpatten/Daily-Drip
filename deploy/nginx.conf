# Serves the single-page web export. HTTPS is handled by Nginx Proxy Manager in front.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/ttf;

    # Bundles and assets have content hashes in their names, so they can be cached forever.
    location ~ ^/(_expo|assets)/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;

        # nginx's mime.types has no .ttf entry, so fonts would go out as uncompressed octet-stream.
        location ~ \.ttf$ {
            types { }
            default_type font/ttf;
        }
    }

    # Every route (/, /history, /auth-callback, ...) is handled by the app in index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
